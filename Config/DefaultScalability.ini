; Texture memory per preset, sized for 4 GB cards at Medium.
[TextureQuality@0]
r.Streaming.PoolSize=600
[TextureQuality@1]
r.Streaming.PoolSize=1200
[TextureQuality@2]
r.Streaming.PoolSize=1800
[TextureQuality@3]
r.Streaming.PoolSize=2500

; Flashlight shadow is the one dynamic shadow that matters; keep it crisp from Medium up.
[ShadowQuality@0]
r.Shadow.MaxResolution=512
[ShadowQuality@1]
r.Shadow.MaxResolution=1024
[ShadowQuality@2]
r.Shadow.MaxResolution=2048
[ShadowQuality@3]
r.Shadow.MaxResolution=2048
